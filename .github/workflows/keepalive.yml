name: Keepalive (stop the 60-day auto-disable)

# GitHub docs: "In a public repository, scheduled workflows are automatically disabled when no
# repository activity has occurred in 60 days." The docs do not define "activity", so this job
# does two things weekly: (1) calls the official "enable workflow" API for both workflows and
# (2) if the last commit is older than 45 days, pushes one tiny commit.
on:
  schedule:
    - cron: "41 6 * * 1"   # Mondays 06:41 UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable scheduled workflows (no-op if already active)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in update.yml keepalive.yml; do
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/enable" && echo "enabled ${wf}"
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}" --jq '"\(.path): \(.state)"'
          done

      - name: Checkout
        uses: actions/checkout@v5

      - name: Commit heartbeat if repo idle > 45 days
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age=$(( (now - last) / 86400 ))
          echo "last commit age: ${age} days"
          if [ "$age" -ge 45 ]; then
            date -u +%FT%TZ > .github/keepalive.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive.txt
            git commit -m "keepalive: repository activity heartbeat"
            git push
          fi
